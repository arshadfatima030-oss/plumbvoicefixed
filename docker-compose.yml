# Several identical app servers + one shared Postgres, behind an nginx load balancer.
#   docker compose up --build              # 3 app servers (see "replicas")
#   docker compose up --build --scale app=5
# Open http://localhost:8080. Reload /api/health a few times and watch "instance" change.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plumbvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: plumbvoice
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumbvoice"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://plumbvoice:${POSTGRES_PASSWORD}@db:5432/plumbvoice
      TRUST_PROXY: "1"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 3
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dbdata:
