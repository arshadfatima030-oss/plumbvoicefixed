# Load balancer in front of the app servers. Docker's DNS returns every replica of "app";
# re-resolving every 5s lets nginx pick up servers that are added, removed or restarted.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    client_max_body_size 1m;

    location / {
        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # nginx is the edge here, so overwrite (don't append to) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        # If one server fails mid-request, try another (safe for idempotent reads only).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
